<style>

const S={fav:new Set([4]),cart:[{i:0,s:1,q:1,on:1},{i:4,s:1,q:2,on:1}],cur:0,cat:'All',sz:1,q:1};
const screens={};
const card=(k,i)=>{const p=P[k];return`<div class="card" style="--i:${i}"><div class="img" style="--c:${p.c}" data-pdp="${k}">${bt(p.c)}<button class="heart ${S.fav.has(k)?'f':''}" data-fav="${k}">${ic('heart')}</button><button class="qa" data-qv="${k}">${ic('plus','style="width:16px"')}</button></div><b class="serif" style="font-size:19px">${p.n}</b><span class="cap">${p.b}</span><div class="p">${f(p.p)}</div></div>`};
screens.splash=()=>`<div class="center"><div class="serif logo">SCENTIFY</div><div class="cap" style="margin-top:22px">Authentic · Curated · Delivered</div></div><div class="pr"></div>`;
const OB=[['Authentic, always.','Every bottle sourced directly from the houses you trust.'],['A scent that is yours.','Answer a few questions and we’ll narrow a thousand to three.'],['Try before you commit.','Discovery minis, so you never buy blind.'],['Delivered with care.','Gift-wrapped and tracked to your door.']];
OB.forEach((o,k)=>screens['ob'+k]=()=>`<div class="center ob"><div class="img" style="--c:${P[[0,4,6,3][k]].c}">${bt(P[[0,4,6,3][k]].c)}</div><div class="t"><div class="cap">0${k+1} / 04</div><h1 class="serif">${o[0]}</h1><p>${o[1]}</p></div></div><div class="dots">${OB.map((_,j)=>`<i class="${j==k?'a':''}"></i>`).join('')}</div><div class="foot"><button class="btn" data-go="${k<3?'ob'+(k+1):'login'}">${k<3?'Continue':'Get started'}</button><button class="link" data-go="login">Skip</button></div>`);
screens.login=()=>`<div class="body" style="padding:0"><div class="lhero"><h1 class="serif">Welcome<br>to Scentify</h1></div><div style="padding:0 24px"><div class="seg"><button class="a" data-seg="0">Sign in</button><button data-seg="1">Create account</button><u id="u"></u></div><label class="fld"><span class="cap">Email</span><input placeholder="you@email.com"></label><label class="fld"><span class="cap">Password</span><input type="password" placeholder="••••••••"></label><div style="text-align:right;margin-bottom:22px"><button class="link">Forgot password?</button></div><button class="btn" data-go="home">Sign in</button><div class="or cap">or continue with</div><div class="soc"><button>Google</button><button>Apple</button></div><p class="cap" style="text-align:center;margin:26px 0 8px;letter-spacing:.04em;text-transform:none">By continuing you agree to our Terms &amp; Privacy Policy</p></div></div>`;
const grid=()=>P.map((p,k)=>[p,k]).filter(([p])=>S.cat=='All'||p.w==S.cat).map(([,k],i)=>card(k,i)).join('');
screens.home=()=>`<div class="body" style="padding:0 0 120px"><div class="top"><button class="ib">${ic('search')}</button><div class="serif logo">SCENTIFY</div><button class="ib" data-go="cart">${ic('bag')}<span class="badge" data-cnt></span></button></div><div class="hero2"><div class="b">${bt('#d8b574')}</div><div><div class="cap">Autumn Edit · 2026</div><h1 class="serif">The art of<br>being <i>remembered.</i></h1><span class="cta2">Discover the edit ${ic('arr','style="width:15px"')}</span></div></div><div style="padding:0 24px"><div class="sec" style="margin-top:8px"><h2 class="serif">Bestsellers</h2><button class="link" data-go="top">See all</button></div><div class="row">${[0,3,1,2].map((k,i)=>card(k,i)).join('')}</div>
<div class="sec"><h2 class="serif">The houses</h2></div><div class="row">${['Creed','Dior','Chanel','Tom Ford','YSL','Byredo'].map(b=>`<div class="brand"><span class="serif">${b[0]}</span>${b}</div>`).join('')}</div>
<div class="sec"><h2 class="serif">The collection</h2></div><div class="ct">${['All','Women','Men','Unisex'].map(c=>`<button class="${c==S.cat?'a':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="grid" id="gr">${grid()}</div></div></div>`;
screens.top=()=>`<div class="bar"><div style="flex:1"><div class="cap">This month</div><h1 class="serif" style="font-size:34px;line-height:1.1">Top 10</h1></div><button class="ib" data-go="cart">${ic('bag')}<span class="badge" data-cnt></span></button></div><div class="body" style="padding-bottom:110px">${[0,1,2,3,4,5,6,7].map((k,i)=>`<div class="li" style="--i:${i}"><span class="serif rank">${i+1}</span><div class="img" style="--c:${P[k].c}" data-pdp="${k}">${bt(P[k].c)}</div><div><span class="cap">${P[k].b}</span><b class="serif" style="display:block;font-size:21px;line-height:1.1">${P[k].n}</b><span style="font-size:13px">${f(P[k].p)}</span></div><button class="heart ${S.fav.has(k)?'f':''}" style="position:static" data-fav="${k}">${ic('heart')}</button></div>`).join('')}</div>`;
const pdp=()=>{const p=P[S.cur],[a,b,c]=p.t.split('|');return`<div class="body" style="padding-bottom:110px"><div class="bar" style="padding:18px 0 8px;position:absolute;left:24px;right:24px;z-index:2"><button class="ib" data-go="home">${ic('back')}</button><span style="flex:1"></span><button class="ib heart ${S.fav.has(S.cur)?'f':''}" style="position:static" data-fav="${S.cur}">${ic('heart')}</button><button class="ib" data-go="cart">${ic('bag')}<span class="badge" data-cnt></span></button></div><div class="pdp"><div class="img" style="--c:${p.c};padding-top:40px">${bt(p.c)}</div></div><div style="margin-top:26px"><div class="cap">${p.b}</div><h1 class="serif" style="font-size:42px;line-height:1.02;margin:4px 0 6px">${p.n}</h1><div style="display:flex;justify-content:space-between;color:var(--mut)"><span>Eau de Parfum</span><span>★ 4.8 · 1,204 reviews</span></div></div>
<div class="cap" style="margin-top:30px">Size</div><div class="sz">${sizes.map((s,i)=>`<button class="${i==S.sz?'a':''}" data-sz="${i}"><b>${s[0]}</b><small>${f(pz(p.p,i))}</small></button>`).join('')}</div>
<h2 class="serif" style="font-size:26px;margin:34px 0 4px">Fragrance notes</h2>${[['Top',a],['Heart',b],['Base',c]].map(([l,v])=>`<div class="note"><span class="cap" style="padding-top:3px">${l}</span><span>${v}</span></div>`).join('')}<div style="margin-top:20px"><button class="acc"><span>Description</span>${ic('chev')}</button><button class="acc" style="border-bottom:1px solid var(--line)"><span>Shipping &amp; authenticity</span>${ic('chev')}</button></div></div><div class="sticky"><div class="step"><button data-q="-1">${ic('minus','style="width:16px"')}</button><span>${S.q}</span><button data-q="1">${ic('plus','style="width:16px"')}</button></div><button class="btn" data-add>Add to bag · ${f(pz(p.p,S.sz)*S.q)}</button></div>`};
screens.pdp=pdp;
const cartTot=()=>S.cart.filter(c=>c.on).reduce((a,c)=>a+pz(P[c.i].p,c.s)*c.q,0);
screens.cart=()=>`<div class="bar"><button class="ib" data-go="home">${ic('back')}</button><h1 class="serif" style="font-size:30px;flex:1;text-align:center;margin-right:40px">Your bag</h1></div><div class="body">${S.cart.length?S.cart.map((c,i)=>{const p=P[c.i];return`<div class="li cr" style="--i:${i}"><button class="chk ${c.on?'on':''}" data-chk="${i}">${ic('ck')}</button><div class="img" style="--c:${p.c}">${bt(p.c)}</div><div><span class="cap">${p.b}</span><b class="serif" style="display:block;font-size:21px;line-height:1.1">${p.n}</b><span style="color:var(--mut);font-size:12px">${sizes[c.s][0]}</span><div style="display:flex;justify-content:space-between;align-items:center"><span>${f(pz(p.p,c.s))}</span><div class="step s"><button data-cq="${i}|-1">${ic('minus','style="width:14px"')}</button><span>${c.q}</span><button data-cq="${i}|1">${ic('plus','style="width:14px"')}</button></div></div></div></div>`}).join(''):'<div class="center" style="height:60%"><div class="serif" style="font-size:30px">Your bag is empty</div></div>'}</div><div class="foot" style="border-top:1px solid var(--line);padding-top:16px"><div class="tot"><span class="cap">Subtotal</span><span class="serif" style="font-size:28px">${f(cartTot())}</span></div><button class="btn">Checkout</button></div>`;
const TB=[['home','Home','home'],['top','Top 10','star'],['home','Discover','disc'],['top','Wishlist','heart'],['login','Account','user']];
function go(id){S.id=id;const el=document.getElementById('s-'+id)||Object.assign(document.createElement('section'),{id:'s-'+id,className:'scr'});if(!el.parentNode)ph.insertBefore(el,$('#ov'));el.innerHTML=screens[id]();document.querySelectorAll('.scr.on').forEach(e=>e!==el&&e.classList.remove('on'));requestAnimationFrame(()=>el.classList.add('on'));const t=$('#tabs');t.classList.toggle('on',id=='home'||id=='top');t.innerHTML=TB.map(([g,l,i])=>`<button class="${g==id&&l!='Discover'&&l!='Wishlist'?'a':''}" data-go="${g}">${ic(i)}${l}</button>`).join('');cnt();if(id=='splash')setTimeout(()=>S.id=='splash'&&go('ob0'),2600)}
const cnt=()=>document.querySelectorAll('[data-cnt]').forEach(e=>{const n=S.cart.reduce((a,c)=>a+c.q,0);e.textContent=n;e.style.display=n?'grid':'none'});
const sheet=k=>{const p=P[k];S.cur=k;S.sz=1;$('#sh').innerHTML=`<div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="serif" style="font-size:26px">Quick view</h2><button class="ib" data-close>${ic('x')}</button></div><div style="display:grid;grid-template-columns:110px 1fr;gap:16px;margin:16px 0 20px"><div class="img" style="--c:${p.c};aspect-ratio:1">${bt(p.c)}</div><div><div class="cap">${p.b}</div><div class="serif" style="font-size:28px;line-height:1.05">${p.n}</div><span style="color:var(--mut)">Eau de Parfum</span></div></div><div class="cap">Size</div><div class="sz" style="margin-bottom:20px">${sizes.map((s,i)=>`<button class="${i==1?'a':''}" data-qsz="${i}"><b>${s[0]}</b><small>${f(pz(p.p,i))}</small></button>`).join('')}</div><button class="btn" data-add style="margin-bottom:10px">Add to bag · <span id="qp">${f(pz(p.p,1))}</span></button><button class="btn alt" data-pdp="${k}">View full details</button>`;$('#sh').classList.add('on');$('#ov').classList.add('on')};
const close=()=>{$('#sh').classList.remove('on');$('#ov').classList.remove('on')};
ph.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-pdp],[data-fav],[data-qv],[data-sz],[data-q],[data-add],[data-chk],[data-cq],[data-close],[data-qsz],[data-seg],[data-cat],#ov');if(!t)return;const d=t.dataset;
if(t.id=='ov'||'close' in d)return close();
if(d.fav){e.stopPropagation();const k=+d.fav;S.fav.has(k)?S.fav.delete(k):S.fav.add(k);document.querySelectorAll(`[data-fav="${k}"]`).forEach(h=>h.classList.toggle('f'));return}
if(d.cat){S.cat=d.cat;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('a',b==t));$('#gr').innerHTML=grid();return}
if(d.qv)return sheet(+d.qv);
if(d.pdp){close();S.cur=+d.pdp;S.sz=1;S.q=1;return go('pdp')}
if(d.go)return go(d.go);
if(d.sz){S.sz=+d.sz;return go('pdp')}
if(d.qsz){S.sz=+d.qsz;document.querySelectorAll('[data-qsz]').forEach(b=>b.classList.toggle('a',b.dataset.qsz==d.qsz));$('#qp').textContent=f(pz(P[S.cur].p,S.sz));return}
if(d.q){S.q=Math.max(1,S.q+ +d.q);return go('pdp')}
if('add' in d){const x=S.cart.find(c=>c.i==S.cur&&c.s==S.sz);x?x.q+=S.q:S.cart.push({i:S.cur,s:S.sz,q:S.id=='pdp'?S.q:1,on:1});close();S.q=1;return go('cart')}
if(d.chk){const c=S.cart[+d.chk];c.on=!c.on;return go('cart')}
if(d.cq){const[i,n]=d.cq.split('|');S.cart[i].q+=+n;if(S.cart[i].q<1)S.cart.splice(i,1);return go('cart')}
if(d.seg){document.querySelectorAll('[data-seg]').forEach(b=>b.classList.toggle('a',b==t));$('#u').style.transform=`translateX(${d.seg*100}%)`}});
go('splash');
</script></body></html>
